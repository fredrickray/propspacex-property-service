syntax = "proto3";

package media;

service MediaService {
    rpc UploadMedia (UploadMediaRequest) returns (UploadMediaResponse);
    rpc GetMedia (MediaRequest) returns (MediaResponse);
}

message UploadMediaRequest {
    string propertyId = 1;
  string fileName = 2;
  string fileType = 3;
  bytes fileData = 4; // Base64 encoded
}

message UploadMediaResponse {
    bool success = 1;
  string mediaUrl = 2;
}

message GetMediaRequest {
  string mediaId = 1;
}

message GetMediaResponse {
    string status = 1;
  string mediaUrl = 2;
  string fileType = 3;
}

message MediaMetadata {
    string media_id = 1;
    string filename = 2;
    int64 size = 3;
    string upload_date = 4;
}